# hypridle — idle management. Launched from configs/autostart.lua.
#
# NOTE: this Hyprland uses the Lua config backend, so `hyprctl dispatch dpms`
# is unusable from a shell (it is mis-parsed as Lua). Display power is done
# with wlopm instead.

general {
    lock_cmd         = pidof hyprlock || hyprlock   # never stack lockers
    before_sleep_cmd = loginctl lock-session        # lock before suspend
    after_sleep_cmd  = wlopm --on '*'               # ensure the panel is on after resume
}

# 2.5 min — dim the screen backlight
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 2.5 min — keyboard backlight off
listener {
    timeout    = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume  = brightnessctl -rd tpacpi::kbd_backlight
}

# 5 min — lock the session (hyprlock, via general.lock_cmd)
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min — turn the display off
listener {
    timeout    = 330
    on-timeout = wlopm --off '*'
    on-resume  = wlopm --on '*'
}

# 30 min — suspend
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
